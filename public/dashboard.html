<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description"
    content="CampusNotify Staff Dashboard — Campus announcements, events, and notifications, plus what you have sent to your students.">
  <title>Staff Dashboard — CampusNotify</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    /* Clickable dashboard items */
    [data-href] { cursor: pointer; }
    [data-href]:focus-visible { outline: 2px solid var(--primary, #6366f1); outline-offset: 2px; }
  </style>
</head>

<body>
  <div class="app-layout">
    <div id="app-sidebar"></div>

    <main class="main-content">
      <!-- Page Header -->
      <div class="page-header animate-fade-in">
        <div class="page-header-row">
          <div>
            <h1>Good <span class="text-gradient" id="greeting">afternoon</span>, <span id="userName">Professor</span> 👋
            </h1>
            <p class="page-subtitle">Here's what's happening on campus and what you've sent to your students.</p>
          </div>
          <div class="flex gap-md">
            <div class="search-bar">
              <span class="search-icon">🔍</span>
              <input type="text" placeholder="Search anything..." id="dashSearch">
            </div>
          </div>
        </div>
      </div>

      <!-- Stats Grid -->
      <div class="stats-grid stagger" id="statsGrid">
        <div class="stat-card animate-scale-in">
          <div class="stat-icon indigo">📢</div>
          <div class="stat-value" id="statAnnouncements">…</div>
          <div class="stat-label">Campus Announcements</div>
        </div>
        <div class="stat-card animate-scale-in">
          <div class="stat-icon cyan">📅</div>
          <div class="stat-value" id="statEvents">…</div>
          <div class="stat-label">Upcoming Events</div>
        </div>
        <div class="stat-card animate-scale-in">
          <div class="stat-icon amber">🔔</div>
          <div class="stat-value" id="statNotifications">…</div>
          <div class="stat-label">Campus Notifications</div>
        </div>
        <div class="stat-card animate-scale-in" data-href="staff-hub.html" tabindex="0" role="link"
          title="Open Staff Hub">
          <div class="stat-icon emerald">📤</div>
          <div class="stat-value" id="statSent">…</div>
          <div class="stat-label">Sent by You</div>
        </div>
      </div>

      <!-- Content Grid -->
      <div class="grid-2">
        <!-- Recent Announcements -->
        <div class="card" style="transform:none;">
          <div class="flex items-center justify-between mb-lg">
            <h3>📢 Recent Announcements</h3>
          </div>
          <div id="recentAnnouncements" class="flex flex-col gap-md"></div>
        </div>

        <!-- Upcoming Events -->
        <div class="card" style="transform:none;">
          <div class="flex items-center justify-between mb-lg">
            <h3>📅 Upcoming Events</h3>
          </div>
          <div id="upcomingEvents" class="flex flex-col gap-md"></div>
        </div>
      </div>

    </main>
  </div>

  <script type="module" src="app.js"></script>
  <script src="stores.js"></script>
  <script type="module">
    import { auth, db } from './firebase-config.js';
    import { onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
    import { collection, onSnapshot, query, where } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';

    // ─── Firestore sources ───
    // Campus-wide items (All Campus) live in *_hub. The *_SS sources are only what THIS staff member sent.
    const SOURCES = {
      annHub: { collection: 'announcement_hub', kind: 'announcement' },
      evHub: { collection: 'event_hub', kind: 'event' },
      notifHub: { collection: 'notification_hub', kind: 'notification' },
      sentAnn: { collection: 'announcement_SS', kind: 'sent', own: true },
      sentEv: { collection: 'event_SS', kind: 'sent', own: true },
      sentNotif: { collection: 'notification_SS', kind: 'sent', own: true }
    };
    Object.values(SOURCES).forEach(src => {
      src.items = [];
      src.ready = false;
      src.error = null;
      src.unsubscribe = null;
    });

    const LABELS = { announcement: 'announcements', event: 'events', notification: 'notifications' };

    document.addEventListener('DOMContentLoaded', () => {
      if (!initPage('dashboard')) return;

      const user = Auth.getUser() || {};
      if (Auth.getRole() !== 'staff') {
        UI.toast('Staff access required.', 'warning');
        setTimeout(() => { window.location.href = 'login.html'; }, 1000);
        return;
      }

      renderGreeting(user);
      initClickNavigation();
      initDashboardSearch();
      renderDashboard();   // shows the loading state right away
      startSync();         // then fills in live data from Firestore

      window.addEventListener('pagehide', () => {
        Object.values(SOURCES).forEach(src => { if (src.unsubscribe) src.unsubscribe(); });
      });
    });

    // ─── Live data ───
    function toItem(snapshotDoc, src) {
      const data = snapshotDoc.data({ serverTimestamps: 'estimate' });
      const createdMs = data.createdAt && data.createdAt.toMillis ? data.createdAt.toMillis() : 0;
      return {
        ...data,
        id: snapshotDoc.id,
        _collection: src.collection,
        createdMs,
        date: data.date || (createdMs ? isoDate(new Date(createdMs)) : isoDate(new Date()))
      };
    }

    // Wait for the signed-in staff member before listening, otherwise Firestore rejects the request.
    function startSync() {
      onAuthStateChanged(auth, (firebaseUser) => {
        Object.values(SOURCES).forEach(src => {
          if (src.unsubscribe) { src.unsubscribe(); src.unsubscribe = null; }
          src.items = [];
          src.ready = false;
          src.error = null;
          if (!firebaseUser) return;

          const ref = src.own
            ? query(collection(db, src.collection), where('authorId', '==', firebaseUser.uid))
            : collection(db, src.collection);
          src.unsubscribe = onSnapshot(ref, (snapshot) => {
            src.items = snapshot.docs.map(d => toItem(d, src));
            src.error = null;
            src.ready = true;
            renderDashboard();
          }, (err) => {
            console.error('Dashboard: ' + src.collection + ' listener failed', err);
            src.items = [];
            src.error = err;
            src.ready = true;
            renderDashboard();
          });
        });
        renderDashboard();
      });
    }

    function sourcesOf(kind) {
      return Object.values(SOURCES).filter(s => s.kind === kind);
    }

    // What this staff member has sent to students
    function sentItems() {
      return sourcesOf('sent').flatMap(s => s.items);
    }

    function itemsOf(kind) {
      return sourcesOf(kind).flatMap(s => s.items);
    }

    // 'loading' | 'error' | 'ok' for everything that feeds one kind of item
    function stateOf(kind) {
      const srcs = sourcesOf(kind);
      if (srcs.some(s => s.error)) return 'error';
      if (srcs.every(s => s.ready)) return 'ok';
      return 'loading';
    }

    function errorOf(kind) {
      const failed = sourcesOf(kind).find(s => s.error);
      return failed ? (failed.error.code || failed.error.message || 'unknown error') : '';
    }

    // ─── Greeting ───
    function renderGreeting(user) {
      const hour = new Date().getHours();
      let greet = 'morning';
      if (hour >= 12 && hour < 17) greet = 'afternoon';
      else if (hour >= 17) greet = 'evening';
      document.getElementById('greeting').textContent = greet;

      const nameParts = (user.name || '').trim().split(/\s+/);
      const titles = ['dr.', 'dr', 'prof.', 'prof', 'mr.', 'mr', 'ms.', 'ms', 'mrs.', 'mrs'];
      let displayName = nameParts[0] || 'Professor';
      if (titles.includes(nameParts[0].toLowerCase()) && nameParts.length > 1) {
        displayName = nameParts.length > 2 ? `${nameParts[0]} ${nameParts[nameParts.length - 1]}` : nameParts[1];
      }
      document.getElementById('userName').textContent = displayName;
    }

    // ─── Click / keyboard navigation for any element with data-href ───
    function initClickNavigation() {
      document.addEventListener('click', (e) => {
        const target = e.target.closest('[data-href]');
        if (target) window.location.href = target.dataset.href;
      });
      document.addEventListener('keydown', (e) => {
        if (e.key !== 'Enter' && e.key !== ' ') return;
        const target = e.target.closest('[data-href]');
        if (!target) return;
        e.preventDefault();
        window.location.href = target.dataset.href;
      });
    }

    // ─── Helpers ───
    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str == null ? '' : String(str);
      return div.innerHTML;
    }

    function isoDate(d) {
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${d.getFullYear()}-${m}-${day}`;
    }

    function dateKey(value) {
      return String(value || '').slice(0, 10);
    }

    function audienceLabel(item) {
      if (!item._collection || !item._collection.endsWith('_SS')) return '';
      const parts = [item.target1, item.target2].filter(Boolean);
      return parts.length ? ` · 🎓 ${escapeHtml(parts.join(', '))}` : '';
    }

    function statusBox(icon, title, text) {
      return `
        <div class="empty-state">
          <div class="empty-icon">${icon}</div>
          <h3>${title}</h3>
          <p>${text}</p>
        </div>`;
    }

    // ─── Main render (stats, recent lists, charts) ───
    function renderDashboard() {
      const today = isoDate(new Date());

      const announcements = itemsOf('announcement');
      const notifications = itemsOf('notification');
      const upcomingEvents = itemsOf('event')
        .filter(ev => dateKey(ev.date) >= today)
        .sort((a, b) => dateKey(a.date).localeCompare(dateKey(b.date)));
      const recentAnnouncements = announcements
        .slice()
        .sort((a, b) => (b.createdMs - a.createdMs) || dateKey(b.date).localeCompare(dateKey(a.date)));

      const annState = stateOf('announcement');
      const evState = stateOf('event');
      const notifState = stateOf('notification');

      setStat('statAnnouncements', annState, announcements.length);
      setStat('statEvents', evState, upcomingEvents.length);
      setStat('statNotifications', notifState, notifications.length);
      setStat('statSent', stateOf('sent'), sentItems().length);

      renderRecentAnnouncements(annState, recentAnnouncements.slice(0, 4));
      renderUpcomingEvents(evState, upcomingEvents.slice(0, 3));
    }

    function setStat(id, state, value) {
      const el = document.getElementById(id);
      if (!el) return;
      el.textContent = state === 'ok' ? value : state === 'error' ? '–' : '…';
    }

    function renderRecentAnnouncements(state, list) {
      const container = document.getElementById('recentAnnouncements');
      if (state === 'loading') {
        container.innerHTML = '<div class="text-muted text-sm">Loading announcements…</div>';
        return;
      }
      if (state === 'error') {
        container.innerHTML = statusBox('⚠️', 'Couldn’t load announcements',
          `Firestore returned: ${escapeHtml(errorOf('announcement'))}. Check that you’re signed in as a staff member.`);
        return;
      }
      if (list.length === 0) {
        container.innerHTML = statusBox('📭', 'No announcements yet',
          'Campus-wide announcements from the admin office will show up here.');
        return;
      }

      container.innerHTML = list.map(a => `
        <div class="notification-item ${a.pinned ? 'unread' : ''}">
          <div class="notification-dot ${a.priority === 'urgent' ? 'alert' : a.priority === 'important' ? 'warning' : 'info'}">
            ${a.priority === 'urgent' ? '🔴' : a.priority === 'important' ? '🟡' : '🔵'}
          </div>
          <div style="flex:1; min-width:0;">
            <div class="font-semibold text-sm" style="margin-bottom:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${escapeHtml(a.title)}</div>
            <div class="text-muted" style="font-size:0.78rem;">${escapeHtml(a.author)} · ${UI.formatDate(a.date)}${audienceLabel(a)}</div>
          </div>
          ${a.pinned ? '<span class="badge badge-primary">Pinned</span>' : ''}
        </div>
      `).join('');
    }

    function renderUpcomingEvents(state, list) {
      const container = document.getElementById('upcomingEvents');
      if (state === 'loading') {
        container.innerHTML = '<div class="text-muted text-sm">Loading events…</div>';
        return;
      }
      if (state === 'error') {
        container.innerHTML = statusBox('⚠️', 'Couldn’t load events',
          `Firestore returned: ${escapeHtml(errorOf('event'))}. Check that you’re signed in as a staff member.`);
        return;
      }
      if (list.length === 0) {
        container.innerHTML = statusBox('📅', 'No upcoming events',
          'Campus-wide events from the admin office will show up here.');
        return;
      }

      container.innerHTML = list.map(ev => {
        const d = new Date(dateKey(ev.date) + 'T00:00:00');
        const day = d.getDate();
        const month = d.toLocaleDateString('en-US', { month: 'short' });
        return `
          <div class="event-card" style="padding:var(--space-lg);">
            <div class="event-date-badge" style="width:52px; height:58px;">
              <span class="day" style="font-size:1.2rem;">${day}</span>
              <span class="month" style="font-size:0.6rem;">${month}</span>
            </div>
            <div style="flex:1; min-width:0;">
              <div class="font-semibold text-sm" style="margin-bottom:4px;">${escapeHtml(ev.title)}</div>
              <div class="text-muted" style="font-size:0.78rem;">📍 ${escapeHtml(ev.location)} · 🕐 ${escapeHtml(ev.time)}${audienceLabel(ev)}</div>
            </div>
          </div>`;
      }).join('');
    }

    // ─── Dashboard Search (searches the live Firestore data) ───
    function initDashboardSearch() {
      const searchInput = document.getElementById('dashSearch');
      if (!searchInput) return;
      const searchBar = searchInput.closest('.search-bar');
      if (!searchBar) return;

      const dropdown = document.createElement('div');
      dropdown.className = 'search-results-dropdown';
      dropdown.id = 'searchDropdown';
      searchBar.appendChild(dropdown);

      const matches = (item, query) =>
        [item.title, item.body, item.description, item.message]
          .some(text => String(text || '').toLowerCase().includes(query));

      searchInput.addEventListener('input', () => {
        const query = searchInput.value.trim().toLowerCase();
        if (query.length < 2) {
          dropdown.classList.remove('active');
          return;
        }

        const matchedAnnouncements = itemsOf('announcement').filter(a => matches(a, query));
        const matchedEvents = itemsOf('event').filter(ev => matches(ev, query));

        if (matchedAnnouncements.length === 0 && matchedEvents.length === 0) {
          dropdown.innerHTML = `<div class="search-empty">🔍 No results found for "<strong>${escapeHtml(searchInput.value.trim())}</strong>"</div>`;
          dropdown.classList.add('active');
          return;
        }

        let html = '';

        if (matchedAnnouncements.length > 0) {
          html += `<div class="search-section-title">📢 Announcements</div>`;
          html += matchedAnnouncements.slice(0, 5).map(a => `
            <div class="search-result-item">
              <div class="result-icon announcement">📢</div>
              <div style="flex:1; min-width:0;">
                <div class="result-title">${highlightMatch(a.title, query)}</div>
                <div class="result-meta">${escapeHtml(a.author)} · ${UI.formatDate(a.date)}</div>
              </div>
              <span class="text-muted" style="font-size:0.7rem;">→</span>
            </div>
          `).join('');
        }

        if (matchedEvents.length > 0) {
          html += `<div class="search-section-title">📅 Events</div>`;
          html += matchedEvents.slice(0, 5).map(ev => `
            <div class="search-result-item">
              <div class="result-icon event">📅</div>
              <div style="flex:1; min-width:0;">
                <div class="result-title">${highlightMatch(ev.title, query)}</div>
                <div class="result-meta">📍 ${escapeHtml(ev.location)} · ${UI.formatDate(ev.date)}</div>
              </div>
              <span class="text-muted" style="font-size:0.7rem;">→</span>
            </div>
          `).join('');
        }

        dropdown.innerHTML = html;
        dropdown.classList.add('active');
      });

      document.addEventListener('click', (e) => {
        if (!searchBar.contains(e.target)) dropdown.classList.remove('active');
      });

      searchInput.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          dropdown.classList.remove('active');
          searchInput.blur();
        }
      });
    }

    function highlightMatch(text, query) {
      const escaped = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      const regex = new RegExp(`(${escaped})`, 'gi');
      return escapeHtml(text).replace(regex, '<mark>$1</mark>');
    }
  </script>
</body>

</html>
